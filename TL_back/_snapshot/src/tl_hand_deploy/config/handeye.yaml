handeye_collect_node:
  ros__parameters:
    output_root: "~/tl_handeye_data"
    tcp_pose_topic: "/tcp_pose"
    joint_state_topic: "/joint_states"
    color_width: 640
    color_height: 480
    fps: 30
    pattern_cols: 10
    pattern_rows: 7
    square_size_m: 0.015
    pose_timeout_sec: 0.5
    settle_seconds: 2.0
    settle_joint_range_deg: 0.15
    min_translation_delta_mm: 20.0
    min_rotation_delta_deg: 8.0
    min_board_area_ratio: 0.02
    min_board_sharpness: 40.0
    show_preview: true
